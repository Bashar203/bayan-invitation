<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4b101d">
<title>دعوة خطوبة بشار وبيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#641626;--wine-dark:#3e0d18;--gold:#c5a36b;--cream:#f8f2e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#21151a;color:var(--cream);font-family:"Readex Pro",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 15%,#6c3840 0,#2a1820 48%,#160f13 100%)}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-12vh;width:13px;height:21px;border-radius:80% 10% 80% 10%;background:linear-gradient(135deg,#f4e5d0,#a82c43 75%);opacity:.7;filter:drop-shadow(0 2px 4px #0005);animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(680deg)}}
.gold-dust{position:fixed;inset:0;pointer-events:none;z-index:4;background-image:radial-gradient(#e5c98c 1px,transparent 1.5px);background-size:73px 89px;opacity:.18;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.09}to{opacity:.28}}
.intro-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,#74404a,#24141b 70%);transition:opacity 1s,visibility 1s}
.intro-screen.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-box{text-align:center;max-width:420px}
.intro-kicker{font-family:Amiri,serif;color:#e8d0a0;font-size:24px;transform:translateY(-7px);text-shadow:0 2px 14px #d5b77c33}
.envelope{width:min(76vw,330px);height:210px;margin:43px auto 27px;position:relative;filter:drop-shadow(0 20px 25px #0008);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.env-base{position:absolute;inset:0;background:linear-gradient(145deg,#fffaf0,#dfd1bd);border:1px solid #d3b77e;border-radius:4px}
.env-fold{position:absolute;inset:0;background:linear-gradient(140deg,#fffdf7,#e7dccb);clip-path:polygon(0 0,100% 0,50% 61%);transform-origin:top;animation:flap 2.8s ease-in-out infinite}
@keyframes flap{0%,35%,100%{transform:rotateX(0)}55%,80%{transform:rotateX(165deg)}}
.wax{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,#9b3449 0,#68182b 48%,#3f0b19 100%);border:4px double #d9b879;color:#f7e6c5;font:38px "Great Vibes",cursive;text-shadow:0 1px 2px #2b0710;box-shadow:inset 0 2px 7px #f4d7a455,0 4px 10px #4a0d1c66}
.primary{border:1px solid #e0c48e;border-radius:999px;padding:13px 27px;background:linear-gradient(120deg,#8b2639,#4b101d);color:#fff5e4;font:500 14px "Readex Pro";cursor:pointer;box-shadow:0 8px 24px #0004;transition:transform .25s,box-shadow .25s}
.primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0006}
main{width:min(100% - 28px,720px);margin:0 auto;padding:38px 0 60px;opacity:0;transform:translateY(35px);transition:opacity 1.1s,transform 1.1s}
main.visible{opacity:1;transform:none}
.header{text-align:center;margin:0 0 24px}
.header .eyebrow{color:#d5b77c;font-size:11px;letter-spacing:3px}
.header h1{font:400 clamp(27px,5vw,42px) Amiri,serif;color:#f4e6cb;margin:8px 0}
.header p{color:#d6c4ad;font-size:12px;margin:0}
.art-frame{position:relative;padding:8px;border:1px solid #c6a36a;background:linear-gradient(135deg,#e8d4a8,#8d6634,#e9d7ac);box-shadow:0 28px 75px #0008;border-radius:3px;overflow:hidden}
.art-frame:before{content:"";position:absolute;inset:13px;border:1px solid #f2dfb6;z-index:2;pointer-events:none}
.artwork{display:block;width:100%;height:auto;transform:scale(1.035);opacity:.1;transition:transform 1.7s cubic-bezier(.2,.8,.2,1),opacity 1.5s}
.visible .artwork{transform:scale(1);opacity:1}
.art-frame:after{content:"";position:absolute;inset:-40% -80%;background:linear-gradient(110deg,transparent 42%,#fff5 50%,transparent 58%);transform:translateX(-100%);pointer-events:none}
.visible .art-frame:after{animation:shine 2.2s 1.2s ease forwards}
@keyframes shine{to{transform:translateX(100%)}}
.map-hotspot{position:absolute;z-index:3;left:31%;top:74.7%;width:38%;height:7.2%;border-radius:50px;display:block}
.map-hotspot:focus{outline:3px solid #fff;outline-offset:3px}
.below{margin:26px auto 0;text-align:center}
.below-title{font:24px Amiri;color:#e8d3a8;margin:0 0 13px}
.countdown{position:relative;display:flex;justify-content:center;align-items:center;gap:0;direction:ltr;flex-wrap:nowrap;max-width:460px;margin:18px auto 0;padding:17px 4px 15px;border-top:1px solid #c5a36b88;border-bottom:1px solid #c5a36b88}
.countdown:before,.countdown:after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);color:#d8b979;background:#2a1820;padding:0 10px;font-size:11px}
.countdown:before{top:-8px}.countdown:after{bottom:-8px}
.unit{position:relative;flex:1;min-width:0;padding:2px 7px;background:transparent;border:0;backdrop-filter:none;text-align:center}
.unit:not(:last-child):after{content:"";position:absolute;right:0;top:18%;height:64%;width:1px;background:linear-gradient(transparent,#b99760,transparent)}
.unit b{display:block;font-family:"Cormorant Garamond",serif;font-size:clamp(29px,7vw,38px);line-height:1.05;font-weight:600;color:#f4e3c1;font-variant-numeric:tabular-nums;text-shadow:0 2px 15px #e1c58b33}
.unit span{display:block;margin-top:7px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#cbb58f}
.map-cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:12px 22px;border:1px solid #c5a36b;border-radius:999px;color:#f7e8ca;text-decoration:none;font-size:13px;transition:.25s}
.map-cta:hover{background:#6a1a2b}
.footer{margin-top:25px;color:#cbb58f;font:19px Amiri}
.note{font-size:10px;color:#9e8b79;margin-top:18px}
@media(max-width:560px){main{width:min(100% - 18px,500px);padding-top:24px}.art-frame{padding:5px}.art-frame:before{inset:9px}.envelope{margin-top:48px}.countdown{max-width:100%;padding:16px 0 14px}.unit{padding:2px 3px}.unit b{font-size:clamp(27px,8vw,34px)}.unit span{font-size:9px;letter-spacing:1px}.map-hotspot{left:30%;width:40%;top:74.7%;height:7.2%}.header p{line-height:1.8}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ambient" id="petals"></div><div class="gold-dust"></div>
<section class="intro-screen" id="intro">
 <div class="intro-box">
  <div class="intro-kicker">بكل الحب… دعوة خاصة لكم</div>
  <div class="envelope" aria-hidden="true"><div class="env-base"></div><div class="env-fold"></div><div class="wax">ب • ب</div></div>
  <button class="primary" id="openBtn">افتح الدعوة ✦</button>
 </div>
</section>
<main id="invitation">
 <header class="header">
  <div class="eyebrow">A SPECIAL CELEBRATION</div>
  <h1>بشار &amp; بيان</h1>
  <p>يسعدنا أن تشاركونا فرحتنا في هذه المناسبة الجميلة</p>
 </header>
 <div class="art-frame">
  <img class="artwork" src="./invitation-artwork.jpg" alt="بطاقة دعوة خطوبة بشار وبيان">
  <a class="map-hotspot" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener" aria-label="افتح موقع قاعات كريستال على الخريطة" title="موقع القاعة"></a>
 </div>
 <section class="below">
  <h2 class="below-title">ننتظركم لنشارككم فرحتنا</h2>
  <div class="countdown" aria-label="الوقت المتبقي">
   <div class="unit"><b id="days">--</b><span>Days</span></div>
   <div class="unit"><b id="hours">--</b><span>Hours</span></div>
   <div class="unit"><b id="minutes">--</b><span>Minutes</span></div>
   <div class="unit"><b id="seconds">--</b><span>Seconds</span></div>
  </div>
  <a class="map-cta" href="https://maps.app.goo.gl/KqMsWvNdrJpMP1V46?g_st=ic" target="_blank" rel="noopener">⌖ &nbsp; افتح موقع القاعة على Google Maps</a>
  <div class="footer">بارك الله لهما وبارك عليهما وجمع بينهما في خير</div>
  <div class="note">08 December 2026 · Amman, Jordan</div>
 </section>
</main>
<script>
const intro=document.getElementById('intro'),main=document.getElementById('invitation');
document.getElementById('openBtn').addEventListener('click',()=>{intro.classList.add('hide');main.classList.add('visible');setTimeout(()=>main.scrollIntoView({behavior:'smooth',block:'start'}),250);});
const target=new Date('2026-12-08T17:30:00+03:00').getTime();
function updateCountdown(){const diff=Math.max(0,target-Date.now());const values={days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)};for(const [id,value] of Object.entries(values))document.getElementById(id).textContent=String(value).padStart(2,'0');}
updateCountdown();setInterval(updateCountdown,1000);
const petalHost=document.getElementById('petals');
for(let i=0;i<18;i++){const p=document.createElement('i');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(12+Math.random()*17)+'s';p.style.animationDelay=(-Math.random()*25)+'s';p.style.setProperty('--drift',(Math.random()*160-80)+'px');p.style.opacity=(.25+Math.random()*.55);p.style.transform='scale('+(0.55+Math.random()*.8)+')';petalHost.appendChild(p);}
</script>
</body>
</html>
